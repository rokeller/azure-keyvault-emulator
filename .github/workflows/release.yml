name: Release

on:
  release:
    types:
      - published

env:
  IMAGE_SERVER: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install pnpm and node for OpenAPI merge
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            .openapi/pnpm-lock.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install mdtohtml
        uses: actions-go/go-install@main
        with:
          module: github.com/gomarkdown/mdtohtml@latest

      - name: Build and test
        run: |
          mdtohtml -page README.md src/AzureKeyVaultEmulator/index.html

          dotnet restore --locked-mode
          dotnet build --no-restore
          dotnet test --no-build \
            --collect:'XPlat Code Coverage' \
            --results-directory .testresults/temp

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: ".testresults/temp/*/coverage.cobertura.xml"
          targetdir: ".coverage"
          reporttypes: "Html_Dark;MarkdownSummaryGithub"
          assemblyfilters: "-*Tests"
          filefilters: "-*.g.cs"

      - name: Write coverage results to job summary
        if: ${{ !cancelled() }}
        run: |
          cat .coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  container-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    needs: build-test
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Install pnpm and node for OpenAPI merge
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            .openapi/pnpm-lock.yaml

      - name: Install mdtohtml
        uses: actions-go/go-install@main
        with:
          module: github.com/gomarkdown/mdtohtml@latest

      # We don't want to add these tools/steps to the Dockerfile, so let's do
      # it here instead.
      - name: Prepare building image
        run: |
          mdtohtml -page README.md src/AzureKeyVaultEmulator/index.html
          dotnet restore --locked-mode
          dotnet build --no-restore

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_SERVER }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Native arm64/amd64 runners build each platform's image directly (no QEMU
      # emulation), pushed by digest only; the merge-manifest job below combines
      # both digests into the final multi-platform tags.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SKIP_CODE_GENERATION=true
          outputs: type=image,name=${{ env.IMAGE_SERVER }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    runs-on: ubuntu-latest
    needs: container-image
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine image tags
        run: |
          bash extract-tags.sh "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_SERVER }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Release builds publish the image with tags <major>, <major>.<minor>, and
      # <major>.<minor>.<patch>.
      - name: Create manifest list and push (release)
        if: ${{ env.VER_MAJOR_MINOR_PATCH == env.VER_FULL }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_SERVER}/${IMAGE_NAME}:v${VER_MAJOR}" \
            --tag "${IMAGE_SERVER}/${IMAGE_NAME}:v${VER_MAJOR_MINOR}" \
            --tag "${IMAGE_SERVER}/${IMAGE_NAME}:v${VER_MAJOR_MINOR_PATCH}" \
            $(printf "${IMAGE_SERVER}/${IMAGE_NAME}@sha256:%s " *)

      # Pre-release builds always publish the image with just the pre-release
      # version tag.
      - name: Create manifest list and push (pre-release)
        if: ${{ env.VER_MAJOR_MINOR_PATCH != env.VER_FULL }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_SERVER}/${IMAGE_NAME}:v${VER_FULL}" \
            $(printf "${IMAGE_SERVER}/${IMAGE_NAME}@sha256:%s " *)
